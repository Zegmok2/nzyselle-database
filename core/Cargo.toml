[package]
name = "nzyselle-core"
version = "0.4.15"
edition = "2021"
description = "Platform-agnostic domain logic for Nzyselle Database: provider adapter contract, capability registry, mock/sandbox adapter. No GUI or Tauri dependency on purpose, so it stays testable anywhere."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
thiserror = "1"
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync", "fs"] }
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
rand = "0.8"
base64 = "0.22"
urlencoding = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util"] }

# Only fetched/compiled when building for Windows, matching this crate's
# actual target platform -- avoids pulling an OS-specific dependency into
# non-Windows dev/test builds at all.
[target.'cfg(windows)'.dependencies]
keyring = "2"
